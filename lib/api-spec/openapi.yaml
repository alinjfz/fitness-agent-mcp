openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 1.0.0
  description: |
    Fitness Agent Layer API — a single backend exposing fitness tools to both
    ChatGPT (Custom GPT Actions) and Claude (MCP server).
    
    Use userId to scope all state to a specific user. A simple string like
    "user_123" or an email is fine for single-user setups.
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: state
    description: Read and write the full fitness state for a user
  - name: tools
    description: Core fitness agent tools
  - name: history
    description: Paginated completion event history
  - name: mcp
    description: Model Context Protocol server for Claude integration
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /state/{userId}:
    get:
      operationId: getState
      tags: [state]
      summary: Get full state for a user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Full fitness state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FitnessState"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: saveState
      tags: [state]
      summary: Save or update user fitness state
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveStateRequest"
      responses:
        "200":
          description: Updated fitness state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FitnessState"

  /log-completion:
    post:
      operationId: logCompletion
      tags: [tools]
      summary: Log a workout or diet completion event
      description: |
        Awards XP, updates streak, checks for new achievements, and returns gamification feedback.
        XP rules: workout=50, diet=30, streak bonus=+10/day (max 10 days), weekly bonus=+100 if 5+ days/week, level up every 500 XP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogCompletionRequest"
      responses:
        "200":
          description: Completion logged with gamification feedback
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogCompletionResponse"

  /normalize:
    post:
      operationId: normalizeUserInput
      tags: [tools]
      summary: Normalize messy user input into structured fitness data
      description: |
        Takes raw user text and uses AI to extract a structured fitness profile patch.
        Pass the result to save_state to persist it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NormalizeRequest"
      responses:
        "200":
          description: Structured data extracted from the input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NormalizeResponse"

  /generate-plan:
    post:
      operationId: generatePlan
      tags: [tools]
      summary: AI-generate a diet or workout plan based on user profile
      description: |
        Reads the user's stored profile and uses AI to generate a structured plan.
        In confirm mode, returns a preview without saving — call again with confirmed:true to save.
        Requires the user's profile to already exist (call save_state first).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeneratePlanRequest"
      responses:
        "200":
          description: Generated plan (saved or preview depending on mode)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratePlanResponse"

  /schedule-events:
    post:
      operationId: scheduleEvents
      tags: [tools]
      summary: Generate and save calendar events for the user's fitness plan
      description: |
        Uses AI to expand a description (e.g. "schedule workouts for a month") into structured calendar events
        based on the user's workout plan and available days.
        In confirm mode, returns a preview without saving — call again with confirmed:true to save.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleEventsRequest"
      responses:
        "200":
          description: Generated events (saved or preview depending on mode)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleEventsResponse"
    delete:
      operationId: clearSchedule
      tags: [tools]
      summary: Clear all scheduled events for a user
      parameters:
        - name: userId
          in: path
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Schedule cleared
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean

  /export/{userId}:
    get:
      operationId: exportReport
      tags: [tools]
      summary: Export a full fitness progress report
      description: |
        Returns a formatted report with profile, progress, achievements, history, diet plan, and workout plan.
        Supports json (default), csv, and html formats.

        The json response includes a `downloadUrl` for every format and, when `format=html`, an additional
        `embedUrl` with `embed=true` appended — use `embedUrl` to open the report inline in a browser or
        iframe, and `downloadUrl` to trigger a file download.

        Pass `embed=true` directly on an html request to strip the Content-Disposition header so the page
        loads inline instead of downloading.
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [json, csv, html]
            default: json
          description: Output format. Defaults to json.
        - name: embed
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: |
            HTML format only. When true, omits the Content-Disposition attachment header so the report
            renders inline in a browser tab or iframe rather than triggering a file download.
      responses:
        "200":
          description: Report in requested format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportReportResponse"
            text/csv:
              schema:
                type: string
            text/html:
              schema:
                type: string

  /progress/{userId}/history:
    get:
      operationId: getHistory
      tags: [history]
      summary: Get paginated completion event history for a user
      description: |
        Returns the user's workout and diet completion history with full pagination support.
        Results are sorted newest-first by default. Supports filtering by event type and sort order.
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
            minimum: 1
          description: Page number (1-indexed). Clamped to totalPages if too high.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            maximum: 100
          description: Entries per page (max 100, invalid values fall back to 20).
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [workout, diet]
          description: Filter history by completion type.
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: desc
          description: Sort order — desc returns newest first (default), asc returns oldest first.
      responses:
        "200":
          description: Paginated completion history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistoryResponse"
        "400":
          description: Invalid type or sort value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No progress record found for this user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /progress/{userId}/reminders/read:
    patch:
      operationId: markRemindersRead
      tags: [tools]
      summary: Mark reminders as read
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items:
                    type: string
                  description: Reminder IDs to mark as read. Omit to mark all as read.
      responses:
        "200":
          description: Reminders marked as read
          content:
            application/json:
              schema:
                type: object

  /system-prompt:
    get:
      operationId: getSystemPrompt
      tags: [tools]
      summary: Get recommended system prompts and integration config for ChatGPT and Claude
      responses:
        "200":
          description: System prompts and integration configuration
          content:
            application/json:
              schema:
                type: object

  /mcp:
    post:
      operationId: mcpEndpoint
      tags: [mcp]
      summary: MCP server endpoint for Claude integration
      description: |
        Model Context Protocol (MCP) JSON-RPC endpoint. All fitness tools are exposed here.
        Requires Accept header to include both application/json and text/event-stream.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: MCP JSON-RPC response
          content:
            application/json:
              schema:
                type: object

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

    UserProfile:
      type: object
      properties:
        userId:
          type: string
        name:
          type: string
        age:
          type: integer
          nullable: true
        weightKg:
          type: number
          nullable: true
        heightCm:
          type: number
          nullable: true
        goal:
          type: string
          enum: [lose_weight, build_muscle, maintain, improve_endurance]
        allergies:
          type: array
          items:
            type: string
        preferences:
          type: array
          items:
            type: string
        budgetPerWeek:
          type: number
          nullable: true
        availableDays:
          type: array
          items:
            type: string
        sessionDurationMin:
          type: integer
          nullable: true
        equipment:
          type: array
          items:
            type: string
        injuries:
          type: array
          items:
            type: string
        mode:
          type: string
          enum: [auto, confirm]
      required: [userId, name, goal, allergies, preferences, availableDays, equipment, injuries, mode]

    Meal:
      type: object
      properties:
        name:
          type: string
        time:
          type: string
        calories:
          type: integer
        protein:
          type: number
        carbs:
          type: number
        fat:
          type: number
        ingredients:
          type: array
          items:
            type: string
      required: [name, calories, protein, carbs, fat, ingredients]

    Macros:
      type: object
      properties:
        proteinG:
          type: number
        carbsG:
          type: number
        fatG:
          type: number
      required: [proteinG, carbsG, fatG]

    DietPlan:
      type: object
      properties:
        meals:
          type: array
          items:
            $ref: "#/components/schemas/Meal"
        dailyCalories:
          type: integer
        macros:
          $ref: "#/components/schemas/Macros"
        notes:
          type: string
          nullable: true
      required: [meals, dailyCalories, macros]

    WorkoutSession:
      type: object
      properties:
        day:
          type: string
        name:
          type: string
        durationMin:
          type: integer
        exercises:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              sets:
                type: integer
              reps:
                type: integer
              restSec:
                type: integer
            required: [name]
      required: [day, name, durationMin, exercises]

    WorkoutPlan:
      type: object
      properties:
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/WorkoutSession"
        notes:
          type: string
          nullable: true
      required: [sessions]

    ScheduleEvent:
      type: object
      properties:
        title:
          type: string
        date:
          type: string
          format: date
        time:
          type: string
        type:
          type: string
          enum: [workout, meal, check_in]
        durationMin:
          type: integer
      required: [title, date, type]

    Schedule:
      type: object
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/ScheduleEvent"
      required: [events]

    Achievement:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        earnedAt:
          type: string
          format: date-time
        xpBonus:
          type: integer
      required: [id, name, description, earnedAt, xpBonus]

    Reminder:
      type: object
      properties:
        id:
          type: string
        message:
          type: string
        type:
          type: string
          enum: [missed_workout, missed_diet, weekly_report, plan_renewal]
        createdAt:
          type: string
          format: date-time
        read:
          type: boolean
      required: [id, message, type, createdAt, read]

    CompletionEvent:
      type: object
      properties:
        type:
          type: string
          enum: [workout, diet]
        completedAt:
          type: string
          format: date-time
        xpGained:
          type: integer
        notes:
          type: string
          nullable: true
      required: [type, completedAt, xpGained]

    Progress:
      type: object
      properties:
        xp:
          type: integer
        streak:
          type: integer
        level:
          type: integer
        history:
          type: array
          items:
            $ref: "#/components/schemas/CompletionEvent"
        achievements:
          type: array
          items:
            $ref: "#/components/schemas/Achievement"
        reminders:
          type: array
          items:
            $ref: "#/components/schemas/Reminder"
        lastLoggedAt:
          type: string
          format: date-time
          nullable: true
        xpToNextLevel:
          type: integer
      required: [xp, streak, level, history, achievements, reminders]

    FitnessState:
      type: object
      properties:
        profile:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/UserProfile"
        dietPlan:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/DietPlan"
        workoutPlan:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/WorkoutPlan"
        schedule:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Schedule"
        progress:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Progress"
      required: [profile, dietPlan, workoutPlan, schedule, progress]

    SaveStateRequest:
      type: object
      properties:
        profile:
          type: object
          properties:
            name:
              type: string
            age:
              type: integer
            weightKg:
              type: number
            heightCm:
              type: number
            goal:
              type: string
              enum: [lose_weight, build_muscle, maintain, improve_endurance]
            allergies:
              type: array
              items:
                type: string
            preferences:
              type: array
              items:
                type: string
            budgetPerWeek:
              type: number
            availableDays:
              type: array
              items:
                type: string
            sessionDurationMin:
              type: integer
            equipment:
              type: array
              items:
                type: string
            injuries:
              type: array
              items:
                type: string
            mode:
              type: string
              enum: [auto, confirm]
        dietPlan:
          $ref: "#/components/schemas/DietPlan"
        workoutPlan:
          $ref: "#/components/schemas/WorkoutPlan"
        schedule:
          $ref: "#/components/schemas/Schedule"

    LogCompletionRequest:
      type: object
      properties:
        userId:
          type: string
        type:
          type: string
          enum: [workout, diet]
        notes:
          type: string
          nullable: true
      required: [userId, type]

    LogCompletionResponse:
      type: object
      properties:
        xpGained:
          type: integer
        totalXp:
          type: integer
        streak:
          type: integer
        level:
          type: integer
        leveledUp:
          type: boolean
        xpToNextLevel:
          type: integer
        message:
          type: string
        newAchievements:
          type: array
          nullable: true
          items:
            type: object
            properties:
              name:
                type: string
              description:
                type: string
              xpBonus:
                type: integer
        reminders:
          type: array
          items:
            $ref: "#/components/schemas/Reminder"
      required: [xpGained, totalXp, streak, level, leveledUp, xpToNextLevel, message]

    NormalizeRequest:
      type: object
      properties:
        input:
          type: string
        userId:
          type: string
      required: [input]

    NormalizeResponse:
      type: object
      properties:
        extracted:
          $ref: "#/components/schemas/SaveStateRequest"
        rawInput:
          type: string
        confidence:
          type: string
          enum: [high, medium, low]
        notes:
          type: string
      required: [extracted, rawInput, confidence]

    GeneratePlanRequest:
      type: object
      properties:
        userId:
          type: string
        type:
          type: string
          enum: [diet, workout]
        confirmed:
          type: boolean
          description: Set to true to save when user is in confirm mode
      required: [userId, type]

    GeneratePlanResponse:
      type: object
      properties:
        plan:
          type: object
          description: The generated diet or workout plan
        saved:
          type: boolean
        requiresConfirmation:
          type: boolean
          nullable: true
        message:
          type: string
          nullable: true
      required: [plan, saved]

    ScheduleEventsRequest:
      type: object
      properties:
        userId:
          type: string
        description:
          type: string
          description: Natural language description (e.g. "schedule workouts for next month")
        startDate:
          type: string
          format: date
          description: Start date (defaults to today)
        durationDays:
          type: integer
          description: Number of days to schedule (default 30)
        confirmed:
          type: boolean
          description: Set to true to save when user is in confirm mode
        eventType:
          type: string
          enum: [workout, meal, both]
      required: [userId]

    ScheduleEventsResponse:
      type: object
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/ScheduleEvent"
        count:
          type: integer
        saved:
          type: boolean
        startDate:
          type: string
        durationDays:
          type: integer
        requiresConfirmation:
          type: boolean
          nullable: true
        message:
          type: string
          nullable: true
      required: [events, count, saved, startDate, durationDays]

    HistoryPagination:
      type: object
      properties:
        page:
          type: integer
          description: Current page number
        limit:
          type: integer
          description: Items per page
        total:
          type: integer
          description: Total entries after any type filter
        totalPages:
          type: integer
        hasNext:
          type: boolean
        hasPrev:
          type: boolean
      required: [page, limit, total, totalPages, hasNext, hasPrev]

    HistorySummary:
      type: object
      properties:
        workoutLogs:
          type: integer
          description: Lifetime total workout completions (unfiltered)
        dietLogs:
          type: integer
          description: Lifetime total diet completions (unfiltered)
        totalLogs:
          type: integer
          description: workoutLogs + dietLogs
        filteredTotal:
          type: integer
          description: Total matching the current type filter (equals total when no filter)
      required: [workoutLogs, dietLogs, totalLogs, filteredTotal]

    HistoryResponse:
      type: object
      properties:
        userId:
          type: string
        history:
          type: array
          items:
            $ref: "#/components/schemas/CompletionEvent"
        pagination:
          $ref: "#/components/schemas/HistoryPagination"
        summary:
          $ref: "#/components/schemas/HistorySummary"
      required: [userId, history, pagination, summary]

    ExportReportProfile:
      type: object
      properties:
        name:
          type: string
        goal:
          type: string
        age:
          type: integer
          nullable: true
        weightKg:
          type: number
          nullable: true
        mode:
          type: string
          enum: [auto, confirm]
      required: [name, goal, mode]

    ExportReportProgress:
      type: object
      properties:
        xp:
          type: integer
        streak:
          type: integer
        level:
          type: integer
        xpToNextLevel:
          type: integer
        workoutLogs:
          type: integer
        dietLogs:
          type: integer
        totalLogs:
          type: integer
      required: [xp, streak, level, xpToNextLevel, workoutLogs, dietLogs, totalLogs]

    ExportReportResponse:
      type: object
      description: |
        JSON fitness report returned by GET /export/{userId}?format=json (the default).
        Also returned by csv and html formats wrapped in their respective content types.
        The `embedUrl` field is only present when format=html — use it to open the interactive
        paginated report inline; use `downloadUrl` to trigger a file download.
      properties:
        exportedAt:
          type: string
          format: date-time
        userId:
          type: string
        profile:
          $ref: "#/components/schemas/ExportReportProfile"
        progress:
          $ref: "#/components/schemas/ExportReportProgress"
        achievements:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              description:
                type: string
              earnedAt:
                type: string
                format: date-time
            required: [name, description, earnedAt]
        dietPlan:
          type: object
          nullable: true
          properties:
            dailyCalories:
              type: integer
            macros:
              type: object
        workoutPlan:
          type: object
          nullable: true
          properties:
            sessionCount:
              type: integer
        schedule:
          type: object
          nullable: true
          properties:
            eventCount:
              type: integer
        recentHistory:
          type: array
          description: Last 10 completion events
          items:
            $ref: "#/components/schemas/CompletionEvent"
        downloadUrl:
          type: string
          description: Relative URL that triggers a file download of this report
        embedUrl:
          type: string
          nullable: true
          description: |
            Relative URL that serves the HTML report inline (no Content-Disposition header).
            Only present when format=html. Use this URL to embed the report in an iframe
            or open it directly in a browser tab.
      required: [exportedAt, userId, profile, progress, achievements, recentHistory, downloadUrl]
